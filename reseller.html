<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6c2cff" />
  <title>iLink Store - Dashboard Reseller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/app.css?v=20261029-layout-v7" />
  <link rel="stylesheet" href="/reseller.css?v=20261029-layout-v7" />
  <link rel="stylesheet" href="/neo-theme.css?v=20261029-layout-v7" />
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
  <!-- App Shell -->
  <section id="appView" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-icon" id="brandAvatar">🛍️</div>
        <div>
          <b id="brandName">TOKO<br>RESELLER</b>
          <span id="brandTagline">Kemitraan Resmi</span>
        </div>
      </div>

      <nav id="nav" class="nav-list">
        <button data-view="dashboard" class="active"><span>🏠</span>Dashboard</button>
        <button data-view="pricing"><span>📦</span>Produk</button>
        <button data-view="nokos"><span>📱</span>Nokos</button>
        <button data-view="smm"><span>📣</span>SMM</button>
        <button data-view="orders"><span>🛒</span>Pesanan</button>
        <button data-view="reports"><span>📊</span>Laporan</button>
        <button data-view="broadcast"><span>📢</span>Broadcast</button>
        <button data-view="users"><span>👥</span>User</button>
        <button data-view="withdraw"><span>💸</span>Tarik Saldo</button>
        <button data-view="bot"><span>⚙️</span>Pengaturan</button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="owner-card">
        <div class="owner-avatar" id="resellerAvatar">👤</div>
        <div>
          <b id="resellerName">Reseller</b>
          <small id="resellerUsername">@reseller</small>
          <span class="owner-pill" style="background:#7be314;color:#0c0c0f">RESELLER</span>
        </div>
      </div>

      <div class="store-balance">
        <span id="storeBalanceLabel">Saldo Komisi Profit</span>
        <strong id="profitBalance">Rp 0</strong>
        <b>👛</b>
      </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <main class="main-panel">
      <header class="topbar">
        <button id="menuBtn" class="square-btn" type="button" aria-label="Menu utama" aria-expanded="false">☰</button>
        <div class="page-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Ringkasan performa toko dan komisi profit Anda</p>
        </div>
        <div class="top-actions">
          <button id="membershipTimerBtn" class="membership-timer" type="button" title="Paket dan perpanjangan"><span id="membershipTimerText">⏱ Masa aktif</span></button>
          <button id="refreshBtn" class="square-btn notify" type="button" title="Refresh Data">⟳</button>
        </div>
      </header>

      <section id="content" class="content">
        <div class="loader-card"><div class="loader-spinner"></div><p>Menghubungkan ke Bot...</p></div>
      </section>

      <footer class="statusbar">
        <span>🛡️ <b id="systemSafe">Sistem Reseller Aktif</b></span>
        <span class="status-sep"></span>
        <span id="lastUpdated">Terakhir diperbarui: -</span>
        <button id="statusBarRefresh" class="neo-btn purple">⟳ Refresh Data</button>
      </footer>
    </main>
  </section>

  <!-- Modal Dialog -->
  <dialog id="modal" class="neo-modal">
    <form method="dialog" id="modalForm">
      <header>
        <h2 id="modalTitle">Modal</h2>
        <button id="modalClose" type="button">✕</button>
      </header>
      <div id="modalAlert" class="modal-alert hidden"></div>
      <div id="modalBody" class="modal-body"></div>
      <footer>
        <button id="modalCancel" type="button" class="neo-btn white">Batal</button>
        <button id="modalSubmit" type="submit" class="neo-btn purple">Simpan</button>
      </footer>
    </form>
  </dialog>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Floating Save Bar for Pricing & Margins -->
  <div id="floatingSaveBar" class="floating-save-bar hidden">
    <div class="save-bar-info">
      <span class="save-bar-icon">⚠️</span>
      <span id="pendingChangesCount">0 perubahan margin belum disimpan</span>
    </div>
    <div class="save-bar-actions">
      <button type="button" id="btnDiscardPricing" class="neo-btn white small">Batalkan</button>
      <button type="button" id="btnSavePricingFloating" class="neo-btn green small">💾 Simpan Perubahan</button>
    </div>
  </div>

  <script src="/request-coordinator.js?v=20261029-layout-v7" defer></script>
  <script src="/services-menu.js?v=20261029-layout-v7" defer></script>
  <script src="/reseller.js?v=20261029-layout-v7" defer></script>
</body>
</html>
